name: Build && Push Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-and-push-release:
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag' && github.base_ref == 'refs/heads/master'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Convert and set version env
        id: process-version
        run: |
          VERSION_TAG=${{ github.ref_name }}
          VERSION_TAG=${VERSION_TAG#v}                              # remove the 'v' prefix
          IFS='.' read -ra VERSION_PARTS <<< "$VERSION_TAG"         # split into array
          VERSION_CODE=$(printf "%1d%02d%03d" "${VERSION_PARTS[0]}" "${VERSION_PARTS[1]}" "${VERSION_PARTS[2]}")
          echo "versionName=$VERSION_TAG" >> $GITHUB_OUTPUT          # "1.2.3"
          echo "versionCode=$VERSION_CODE" >> $GITHUB_OUTPUT         # "102003"

      - name: Re-write version
        run: |
          sed -i "s/VERSION_NAME.*/VERSION_NAME=${{ steps.process-version.outputs.versionName }}/g" gradle.properties
          sed -i "s/VERSION_CODE.*/VERSION_CODE=${{ steps.process-version.outputs.versionCode }}/g" gradle.properties
          sed -i "s/signAllPublications.*/signAllPublications=true/g" gradle.properties
          cat gradle.properties

      - name: "Get sdkVersion from versions.toml"
        id: read_version
        shell: bash
        run: |
          version=`perl -nlE 'say if s/compileSdkVersion \= \"(.*)\"/$1/g' gradle/libs.versions.toml`
          echo "sdkVersion=$version" >> $GITHUB_OUTPUT

      - name: Setup Android SDK
        uses: amyu/setup-android@v5
        with:
          sdk-version: ${{ steps.read_version.outputs.sdkVersion }}

      - name: Publish to MavenCentral
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ vars.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon publishToMavenCentral

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}